<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>C Practice</title>
<style>
  :root {
    --bg: #000; --panel: #080808; --panel2: #151515; --border: #2b2b2b;
    --text: #e6e9ef; --muted: #969696; --accent: #4f8cff; --ok: #3ecf8e; --bad: #ff6b6b; --warn: #f5b942;
  }
  body.light {
    --bg: #f5f5f5; --panel: #fff; --panel2: #ededed; --border: #d2d2d2;
    --text: #171717; --muted: #626262; --accent: #1769d1; --ok: #16834d; --bad: #c72c41; --warn: #986900;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { background: var(--bg); color: var(--text); font: 14px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; display: flex; flex-direction: column; }
  header { display: flex; align-items: center; gap: 12px; padding: 8px 14px; background: var(--panel); border-bottom: 1px solid var(--border); flex-wrap: wrap; }
  header h1 { font-size: 15px; margin: 0 8px 0 0; font-weight: 600; }
  #menuToggle { background: transparent; color: var(--text); border: 1px solid var(--border); border-radius: 6px; padding: 4px 9px; cursor: pointer; font: inherit; font-size: 18px; line-height: 1; }
  #themeToggle { background: transparent; color: var(--muted); border: 1px solid var(--border); border-radius: 6px; padding: 4px 10px; cursor: pointer; font: inherit; }
  #sections { display: flex; gap: 6px; }
  .section { background: transparent; color: var(--muted); border: 1px solid var(--border); border-radius: 6px; padding: 4px 12px; cursor: pointer; font: inherit; }
  .section.active { color: #fff; border-color: var(--accent); background: rgba(79,140,255,.2); }
  #tabs { display: flex; gap: 6px; flex-wrap: wrap; }
  .tab { background: var(--panel2); color: var(--text); border: 1px solid var(--border); border-radius: 6px; padding: 4px 12px; cursor: pointer; font: inherit; }
  .tab.active { background: var(--accent); border-color: var(--accent); color: #fff; }
  main { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(280px, 42%) 1fr; }
  #left { overflow-y: auto; padding: 18px 22px; border-right: 1px solid var(--border); background: var(--panel); }
  #left h2 { margin: 0 0 12px; font-size: 18px; }
  #statement { white-space: pre-wrap; }
  .case { margin-top: 14px; background: var(--panel2); border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px; }
  .case h4 { margin: 0 0 6px; font-size: 12px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); }
  .lbl { font-size: 11px; color: var(--muted); margin-top: 6px; }
  pre { margin: 2px 0 0; font: 13px/1.45 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; white-space: pre-wrap; word-break: break-all; }
  .note { margin-top: 16px; color: var(--muted); font-size: 12px; }
  #right { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
  #toolbar { display: flex; align-items: center; gap: 8px; padding: 8px 12px; background: var(--panel); border-bottom: 1px solid var(--border); }
  #toolbar .spacer { flex: 1; }
  button.act { border: 0; border-radius: 6px; padding: 6px 16px; font: inherit; font-weight: 600; cursor: pointer; color: #fff; }
  button.act:disabled { opacity: .5; cursor: wait; }
  #run { background: #394156; }
  #submit { background: var(--ok); color: #06210f; }
  #reset { background: transparent; color: var(--muted); border: 1px solid var(--border); font-weight: 400; }
  #editorWrap { flex: 1 1 55%; min-height: 160px; position: relative; }
  #editor, #fallback { position: absolute; inset: 0; }
  #fallback { width: 100%; height: 100%; background: #080808; color: #ddd; border: 0; padding: 10px; font: 14px/1.5 ui-monospace, Menlo, Consolas, monospace; resize: none; tab-size: 4; display: none; }
  body.light #fallback { background: #fff; color: #171717; }
  #bottom { flex: 1 1 45%; min-height: 140px; display: flex; flex-direction: column; border-top: 1px solid var(--border); background: var(--panel); }
  #btabs { display: flex; gap: 2px; padding: 6px 10px 0; }
  .btab { padding: 4px 12px; cursor: pointer; border: 0; background: transparent; color: var(--muted); font: inherit; border-bottom: 2px solid transparent; }
  .btab.active { color: var(--text); border-bottom-color: var(--accent); }
  .pane { flex: 1; overflow: auto; padding: 10px 14px; display: none; }
  .pane.active { display: block; }
  textarea#stdin { width: 100%; height: 100%; min-height: 80px; background: var(--panel2); color: var(--text); border: 1px solid var(--border); border-radius: 6px; padding: 8px; font: 13px ui-monospace, Menlo, Consolas, monospace; resize: none; }
  .badge { display: inline-block; padding: 1px 8px; border-radius: 10px; font-size: 12px; font-weight: 600; }
  .AC, .OK { background: rgba(62,207,142,.15); color: var(--ok); }
  .WA, .RE, .CE, .TLE, .OLE { background: rgba(255,107,107,.15); color: var(--bad); }
  .summary { font-size: 15px; font-weight: 600; margin-bottom: 8px; }
  .row { border: 1px solid var(--border); border-radius: 6px; margin-bottom: 6px; background: var(--panel2); }
  .row summary { cursor: pointer; padding: 6px 10px; display: flex; gap: 10px; align-items: center; }
  .row.nodetail summary { cursor: default; }
  .row .body { padding: 2px 12px 10px; }
  .err { color: var(--bad); }
  .muted { color: var(--muted); }
  #sidebar { position: fixed; z-index: 5; top: 0; bottom: 0; left: 0; width: 290px; overflow-y: auto; padding: 16px 12px; background: var(--panel); border-right: 1px solid var(--border); box-shadow: 8px 0 24px rgba(0,0,0,.25); transform: translateX(-100%); transition: transform .18s ease; }
  body.sidebar-open #sidebar { transform: translateX(0); }
  #sidebarHead { display: flex; align-items: center; justify-content: space-between; margin-bottom: 18px; }
  #sidebarHead strong { font-size: 16px; }
  #sidebarClose { background: transparent; color: var(--muted); border: 0; cursor: pointer; font-size: 22px; line-height: 1; }
  .topicGroup { margin: 0 0 18px; }
  .topicGroup h3 { color: var(--muted); font-size: 11px; letter-spacing: .08em; margin: 0 8px 6px; text-transform: uppercase; }
  .topic { width: 100%; display: flex; align-items: center; justify-content: space-between; gap: 8px; background: transparent; color: var(--text); border: 0; border-radius: 6px; padding: 7px 9px; cursor: pointer; font: inherit; text-align: left; }
  .topic:hover { background: var(--panel2); }
  .topic.active { background: rgba(79,140,255,.2); color: #fff; }
  .topic small { color: var(--muted); }
  .questionList { display: block; padding: 2px 0 4px 10px; }
  .question { width: 100%; display: block; background: transparent; color: var(--muted); border: 0; border-left: 2px solid var(--border); padding: 6px 8px; cursor: pointer; font: inherit; font-size: 12px; text-align: left; }
  .question:hover, .question.current { color: var(--text); border-left-color: var(--accent); background: rgba(79,140,255,.08); }
  #sidebarBackdrop { display: none; position: fixed; z-index: 4; inset: 0; background: rgba(0,0,0,.35); }
  body.sidebar-open #sidebarBackdrop { display: block; }
  @media (min-width: 900px) { body.sidebar-open main { margin-left: 290px; } body.sidebar-open #sidebarBackdrop { display: none; } }
  @media (max-width: 700px) { main { grid-template-columns: 1fr; grid-template-rows: 42% 58%; } #left { border-right: 0; border-bottom: 1px solid var(--border); } }
</style>
</head>
<body class="sidebar-open">
<header>
  <button id="menuToggle" title="Open topics" aria-label="Open topics">☰</button>
  <h1>C Practice</h1>
  <div id="sections"></div>
  <div id="tabs"></div>
  <button id="themeToggle" title="Switch color mode"></button>
</header>

<aside id="sidebar" aria-label="Practice topics">
  <div id="sidebarHead"><strong>Topics</strong><button id="sidebarClose" title="Close topics" aria-label="Close topics">×</button></div>
  <div id="topicGroups"></div>
</aside>
<div id="sidebarBackdrop"></div>

<main>
  <section id="left">
    <h2 id="title"></h2>
    <div id="statement"></div>
    <div id="cases"></div>
    <div class="note" id="hiddenNote"></div>
  </section>

  <section id="right">
    <div id="toolbar">
      <span class="muted">main.c (C, gcc)</span>
      <span class="spacer"></span>
      <button class="act" id="reset" title="Restore starter code">Reset</button>
      <button class="act" id="run">Run</button>
      <button class="act" id="submit">Submit</button>
    </div>
    <div id="editorWrap">
      <div id="editor"></div>
      <textarea id="fallback" spellcheck="false"></textarea>
    </div>
    <div id="bottom">
      <div id="btabs">
        <button class="btab active" data-pane="paneInput">Custom input</button>
        <button class="btab" data-pane="paneOutput">Output</button>
        <button class="btab" data-pane="paneResults">Test results</button>
      </div>
      <div class="pane active" id="paneInput"><textarea id="stdin" spellcheck="false" placeholder="stdin for the Run button"></textarea></div>
      <div class="pane" id="paneOutput"><span class="muted">Press Run to execute your program with the custom input.</span></div>
      <div class="pane" id="paneResults"><span class="muted">Press Submit to run all test cases.</span></div>
    </div>
  </section>
</main>

<script src="https://cdn.jsdelivr.net/npm/monaco-editor@0.45.0/min/vs/loader.js"></script>
<script>
const DEFAULT_TEMPLATE = '#include <stdio.h>\n\nint main(void) {\n    \n    return 0;\n}\n';
let problems = [], visibleProblems = [], cur = 0, editor = null, section = 'Sorting';

const $ = (id) => document.getElementById(id);
function el(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text !== undefined) e.textContent = text;
  return e;
}
function codeKey(id) { return 'code-' + id; }
function store(k, v) { try { localStorage.setItem(k, v); } catch (_) {} }
function load(k) { try { return localStorage.getItem(k); } catch (_) { return null; } }
function applyTheme() {
  const light = load('theme') === 'light';
  document.body.classList.toggle('light', light);
  $('themeToggle').textContent = light ? 'Dark mode' : 'White mode';
  if (typeof monaco !== 'undefined' && monaco.editor) monaco.editor.setTheme(light ? 'vs' : 'vs-dark');
}

/* ---------- editor (Monaco with textarea fallback) ---------- */
function makeFallback() {
  const ta = $('fallback');
  ta.style.display = 'block';
  ta.addEventListener('keydown', (e) => {
    if (e.key === 'Tab') {
      e.preventDefault();
      const s = ta.selectionStart;
      ta.value = ta.value.slice(0, s) + '    ' + ta.value.slice(ta.selectionEnd);
      ta.selectionStart = ta.selectionEnd = s + 4;
    }
  });
  ta.addEventListener('input', () => saveCode());
  return { getValue: () => ta.value, setValue: (v) => { ta.value = v; } };
}

function initEditor() {
  return new Promise((resolve) => {
    let settled = false;
    const fallback = () => { if (!settled) { settled = true; editor = makeFallback(); resolve(); } };
    const timer = setTimeout(fallback, 6000);
    if (typeof require === 'undefined' || !require.config) { clearTimeout(timer); return fallback(); }
    require.config({ paths: { vs: 'https://cdn.jsdelivr.net/npm/monaco-editor@0.45.0/min/vs' } });
    require(['vs/editor/editor.main'], () => {
      if (settled) return;
      settled = true; clearTimeout(timer);
      const m = monaco.editor.create($('editor'), {
        value: DEFAULT_TEMPLATE, language: 'c', theme: load('theme') === 'light' ? 'vs' : 'vs-dark',
        automaticLayout: true, fontSize: 14, minimap: { enabled: false },
        scrollBeyondLastLine: false, tabSize: 4, insertSpaces: true,
      });
      m.onDidChangeModelContent(() => saveCode());
      editor = { getValue: () => m.getValue(), setValue: (v) => m.setValue(v) };
      resolve();
    }, fallback);
  });
}

function saveCode(problem = visibleProblems[cur]) {
  if (editor && problem) store(codeKey(problem.id), editor.getValue());
}
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'hidden') saveCode();
});
window.addEventListener('beforeunload', () => saveCode());

/* ---------- problem rendering ---------- */
function renderTabs() {
  const t = $('tabs'); t.textContent = '';
  visibleProblems.forEach((p, i) => {
    const b = el('button', 'tab' + (i === cur ? ' active' : ''), 'Q' + (i + 1));
    b.title = p.title;
    b.onclick = () => select(i);
    t.appendChild(b);
  });
}

function renderSections() {
  const s = $('sections'); s.textContent = '';
  ['Sorting'].forEach((name) => {
    const b = el('button', 'section' + (name === section ? ' active' : ''), name);
    b.onclick = () => {
      if (name === section) return;
      const previousProblem = visibleProblems[cur];
      saveCode(previousProblem);
      section = name;
      visibleProblems = problems.filter((p) => p.category === section);
      cur = 0;
      renderSections();
      select(0, false);
    };
    s.appendChild(b);
  });
}

function renderSidebar() {
  const root = $('topicGroups'); root.textContent = '';
  const groups = [
    { label: 'Basic Logic Questions', topics: [['Logical', 'Basic Logic'], ['Array', 'Array'], ['2D Arrays', '2D Arrays'], ['Strings', 'Strings'], ['Functions', 'Functions']] },
    { label: 'Today', topics: [['Sorting', 'Sorting']] },
  ];
  groups.forEach((group) => {
    const wrap = el('div', 'topicGroup');
    wrap.appendChild(el('h3', null, group.label));
    group.topics.forEach(([name, label]) => {
      const topic = el('button', 'topic' + (name === section ? ' active' : ''));
      topic.appendChild(el('span', null, label));
      topic.appendChild(el('small', null, problems.filter((p) => p.category === name).length));
      topic.onclick = () => {
        if (name === section) { document.body.classList.remove('sidebar-open'); return; }
        saveCode(visibleProblems[cur]);
        section = name;
        visibleProblems = problems.filter((p) => p.category === section);
        cur = section === 'Sorting' ? Math.min(4, visibleProblems.length - 1) : 0;
        renderSections();
        renderSidebar();
        select(0, false);
      };
      wrap.appendChild(topic);
      const list = el('div', 'questionList');
      problems.filter((p) => p.category === name).forEach((p) => {
        const q = el('button', 'question' + (name === section && visibleProblems[cur] && p.id === visibleProblems[cur].id ? ' current' : ''), p.title);
        q.onclick = () => {
          section = name;
          visibleProblems = problems.filter((item) => item.category === section);
          select(visibleProblems.findIndex((item) => item.id === p.id));
          renderSections(); renderSidebar();
          document.body.classList.remove('sidebar-open');
        };
        list.appendChild(q);
      });
      wrap.appendChild(list);
    });
    root.appendChild(wrap);
  });
}

function select(i, savePrevious = true) {
  const previousProblem = visibleProblems[cur];
  if (savePrevious) saveCode(previousProblem);
  cur = i;
  const p = visibleProblems[i];
  if (!p) return;
  renderTabs();
  $('title').textContent = p.title;
  $('statement').textContent = p.statement;
  const cases = $('cases'); cases.textContent = '';
  p.tests.forEach((t, k) => {
    const c = el('div', 'case');
    c.appendChild(el('h4', null, 'Visible test case ' + (k + 1)));
    c.appendChild(el('div', 'lbl', 'Input'));
    c.appendChild(el('pre', null, t.input.replace(/\n$/, '')));
    c.appendChild(el('div', 'lbl', 'Expected output'));
    c.appendChild(el('pre', null, t.expected));
    cases.appendChild(c);
  });
  $('hiddenNote').textContent = p.hiddenCount
    ? p.hiddenCount + ' hidden test case' + (p.hiddenCount > 1 ? 's' : '') + ' will also be checked when you submit.'
    : '';
  editor.setValue(load(codeKey(p.id)) || p.template || DEFAULT_TEMPLATE);
  $('stdin').value = p.tests.length ? p.tests[0].input : '';
  $('paneOutput').textContent = '';
  $('paneOutput').appendChild(el('span', 'muted', 'Press Run to execute your program with the custom input.'));
  $('paneResults').textContent = '';
  $('paneResults').appendChild(el('span', 'muted', 'Press Submit to run all test cases.'));
  showPane('paneInput');
  $('left').scrollTop = 0;
  renderSidebar();
}

function showPane(id) {
  document.querySelectorAll('.pane').forEach((x) => x.classList.toggle('active', x.id === id));
  document.querySelectorAll('.btab').forEach((x) => x.classList.toggle('active', x.dataset.pane === id));
}
document.querySelectorAll('.btab').forEach((b) => b.onclick = () => showPane(b.dataset.pane));
$('menuToggle').onclick = () => document.body.classList.add('sidebar-open');
$('sidebarClose').onclick = () => document.body.classList.remove('sidebar-open');
$('sidebarBackdrop').onclick = () => document.body.classList.remove('sidebar-open');
$('themeToggle').onclick = () => { store('theme', load('theme') === 'light' ? 'dark' : 'light'); applyTheme(); };
applyTheme();

/* ---------- API calls ---------- */
const LABEL = { AC: 'Accepted', OK: 'Ran OK', WA: 'Wrong Answer', RE: 'Runtime Error', CE: 'Compile Error', TLE: 'Time Limit Exceeded', OLE: 'Output Limit Exceeded' };
function badge(s) { return el('span', 'badge ' + s, LABEL[s] || s); }

// Sends the access code (if the mentor set one) and asks for it when the server says it is needed.
async function api(url, opts = {}) {
  for (let attempt = 0; attempt < 3; attempt++) {
    const headers = Object.assign({}, opts.headers, { 'x-access-code': load('access-code') || '' });
    const r = await fetch(url, Object.assign({}, opts, { headers }));
    if (r.status === 401) {
      const c = prompt('Enter the access code your mentor gave you:');
      if (c === null) throw new Error('Access code required.');
      store('access-code', c);
      continue;
    }
    return r;
  }
  throw new Error('Wrong access code.');
}

async function post(url, body) {
  const r = await api(url, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.error || ('HTTP ' + r.status));
  return j;
}

function busy(on) { $('run').disabled = on; $('submit').disabled = on; }

$('run').onclick = async () => {
  busy(true);
  const out = $('paneOutput'); out.textContent = ''; out.appendChild(el('span', 'muted', 'Compiling and running...'));
  showPane('paneOutput');
  try {
    const r = await post('/api/run', { code: editor.getValue(), input: $('stdin').value });
    out.textContent = '';
    out.appendChild(badge(r.status));
    if (r.timeMs !== undefined) out.appendChild(el('span', 'muted', '  ' + r.timeMs + ' ms'));
    if (r.status === 'CE') { out.appendChild(el('pre', 'err', r.compileError)); return; }
    if (r.warnings) { out.appendChild(el('div', 'lbl', 'Compiler warnings')); out.appendChild(el('pre', 'muted', r.warnings)); }
    out.appendChild(el('div', 'lbl', 'stdout'));
    out.appendChild(el('pre', null, r.stdout || '(empty)'));
    if (r.stderr) { out.appendChild(el('div', 'lbl', 'stderr')); out.appendChild(el('pre', 'err', r.stderr)); }
    if (r.status === 'RE') out.appendChild(el('div', 'err', 'Exit code ' + r.exitCode + (r.signal ? ', signal ' + r.signal : '')));
  } catch (e) {
    out.textContent = ''; out.appendChild(el('pre', 'err', String(e.message || e)));
  } finally { busy(false); }
};

$('submit').onclick = async () => {
  busy(true);
  const pane = $('paneResults'); pane.textContent = ''; pane.appendChild(el('span', 'muted', 'Compiling and judging...'));
  showPane('paneResults');
  try {
    const r = await post('/api/submit', { code: editor.getValue(), problemId: visibleProblems[cur].id });
    pane.textContent = '';
    if (!r.compiled) {
      pane.appendChild(badge('CE'));
      pane.appendChild(el('pre', 'err', r.compileError));
      return;
    }
    const all = r.passed === r.total;
    const s = el('div', 'summary', all ? 'All tests passed (' + r.passed + '/' + r.total + ')' : 'Passed ' + r.passed + ' / ' + r.total);
    s.style.color = all ? 'var(--ok)' : 'var(--warn)';
    pane.appendChild(s);
    r.results.forEach((t) => {
      if (t.kind === 'hidden') {
        const row = el('div', 'row nodetail');
        const sm = el('summary'); sm.appendChild(el('span', null, 'Hidden test ' + t.index)); sm.appendChild(badge(t.status));
        row.appendChild(sm); pane.appendChild(row);
      } else {
        const row = el('details', 'row');
        if (t.status !== 'AC') row.open = true;
        const sm = el('summary'); sm.appendChild(el('span', null, 'Visible test ' + t.index)); sm.appendChild(badge(t.status));
        row.appendChild(sm);
        const body = el('div', 'body');
        body.appendChild(el('div', 'lbl', 'Input')); body.appendChild(el('pre', null, t.input.replace(/\n$/, '')));
        body.appendChild(el('div', 'lbl', 'Expected')); body.appendChild(el('pre', null, t.expected));
        body.appendChild(el('div', 'lbl', 'Your output')); body.appendChild(el('pre', null, t.output || '(empty)'));
        row.appendChild(body); pane.appendChild(row);
      }
    });
  } catch (e) {
    pane.textContent = ''; pane.appendChild(el('pre', 'err', String(e.message || e)));
  } finally { busy(false); }
};

$('reset').onclick = () => {
  if (!confirm('Replace your code with the starter template?')) return;
  editor.setValue(visibleProblems[cur].template || DEFAULT_TEMPLATE);
};

/* ---------- boot ---------- */
(async function () {
  problems = await (await api('/api/problems')).json();
  visibleProblems = problems.filter((p) => p.category === section);
  cur = section === 'Sorting' ? Math.min(4, visibleProblems.length - 1) : 0;
  await initEditor();
  renderSections();
  renderSidebar();
  select(cur);
})();
</script>
</body>
</html>
